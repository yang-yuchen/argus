[project]
name = "ArgusBench"
version = "0.1.0"
requires-python = ">=3.10"
description = "ArgusBench: A Benchmark Suite Full of Attention"
authors = [{ name = "Yifan Zhao" }]

# 1. We use PyTorch not just as a kernel library, but also as the library for sending tensors.
#    For this purpose, any version of PyTorch is fine.
# 2. NVTX is always installed because it's safe to do so even on AMD GPUs (it just does nothing).
#    AMD ROCm doesn't seem to have an installable tracing tool like NVTX -- there is a dyn-lib in ROCm
#    that we look for and load at runtime.
dependencies = ["torch >= 2", "nvtx ~= 0.2.11", "coloredlogs ~= 15.0"]

[project.optional-dependencies]
# 1. For result stability, all version numbers for kernel libraries are exact.
# 2. Installing `flashattn` requires custom pip flags. You need to install it manually:
#    On Nvidia GPUs, it can be as simple as `pip install flash-attn==2.8.3 --no-build-isolation`.
#    For AMD GPUs, see the `flashattn` README.
#    If you don't have flashattn already installed, requiring this `flashattn` dependency group does not help.
#    Once it's installed, you can add this group to check compatibility.
flashattn = ["flash-attn == 2.8.3", "psutil"]
flashinfer = ["flashinfer-python == 0.3.1.post1"]
pytorch = ["torch == 2.8.0"]
xformers = ["xformers == 0.0.32.post2"]
test = ["pytest"]
# TODO: mirage
# MAX_JOBS=32 pip install mirage-project==0.2.2

[project.scripts]
argus-bench = "argus.bench:main"
argus-analyze = "argus.analyze:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.ruff]
line-length = 100
indent-width = 4
